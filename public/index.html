<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Poll</title>
</head>
<body>
    <h1>Current Poll</h1>
    <div id="poll-container"></div>

    <script>
        async function loadPoll() {
            const res = await fetch('/api/poll');
            const poll = await res.json();
            const container = document.getElementById('poll-container');
            
            if (!poll.question) {
                container.innerHTML = '<p>No active poll</p>';
                return;
            }

            container.innerHTML = `
                <h2>${poll.question}</h2>
                <form id="vote-form">
                    ${poll.options.map((option, i) => `
                        <div>
                            <input type="radio" name="vote" value="${i}" required>
                            <label>${option}</label>
                        </div>
                    `).join('')}
                    <button type="submit">Vote</button>
                </form>
            `;

            document.getElementById('vote-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const voteIndex = formData.get('vote');
                
                await fetch('/api/vote', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({index: voteIndex})
                });
                
                alert('Vote recorded!');
            });
        }

        loadPoll();
    </script>
</body>
</html>
