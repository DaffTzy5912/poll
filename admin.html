<!DOCTYPE html>
<html>
<head>
  <title>Admin - Upload Poll</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>Upload a New Poll</h1>
  <form id="poll-form">
    <input type="text" name="question" placeholder="Poll question" required><br>
    <input type="text" name="option1" placeholder="Option 1" required><br>
    <input type="text" name="option2" placeholder="Option 2" required><br>
    <button type="submit">Upload</button>
  </form>

  <script src="/js/admin.js"></script>
</body>
</html>
